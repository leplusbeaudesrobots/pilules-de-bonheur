name: APK Android

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Dépendances
        run: npm ci

      - name: Vérifs
        run: |
          npm run typecheck
          npm test

      - name: Génération du projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilation APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Renommage
        run: cp android/app/build/outputs/apk/release/app-release.apk pilules-de-bonheur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pilules-de-bonheur-apk
          path: pilules-de-bonheur.apk

      - name: Publication (lien de téléchargement stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest pilules-de-bonheur.apk \
            --title "Pilules de bonheur (dernière version)" \
            --notes "APK construit depuis ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Télécharge-le depuis ton téléphone Android et installe-le." \
            --target "${{ github.sha }}"
